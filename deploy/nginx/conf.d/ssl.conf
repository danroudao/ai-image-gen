# AI Image Generator — SSL/TLS 配置
#
# 使用 Let's Encrypt 后替换证书路径：
#   sudo certbot --nginx -d 你的域名.com

ssl_certificate     /etc/letsencrypt/live/gen.121438.xyz/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/gen.121438.xyz/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;

ssl_stapling on;
ssl_stapling_verify on;

# 仅在配置正确时启用 HSTS（security.conf 中已有）
# add_header Strict-Transport-Security "max-age=63072000" always;
