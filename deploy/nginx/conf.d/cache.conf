# AI Image Generator — 静态资源缓存

# 前端构建产物（带 hash）
location /_next/static {
    expires 365d;
    add_header Cache-Control "public, immutable";
}

# 静态资源
location /static {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# favicon
location = /favicon.ico {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}
