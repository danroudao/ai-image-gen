# AI Image Generator — Gzip 压缩

gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;

gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/x-javascript
    application/xhtml+xml
    image/svg+xml
    font/woff
    font/woff2;
