# AI Image Generator — Nginx 主配置（HTTP 版）
# 使用 Let's Encrypt 后参考 DEPLOY.md 启用 SSL

server {
    listen 11666;
    server_name gen.121438.xyz;

    include /home/drd/nginx/conf.d/ai-image-gen/security.conf;
    include /home/drd/nginx/conf.d/ai-image-gen/gzip.conf;
    include /home/drd/nginx/conf.d/ai-image-gen/cache.conf;
    include /home/drd/nginx/conf.d/ai-image-gen/proxy.conf;

    location / {
        proxy_pass http://ai-image-gen;
        proxy_http_version 1.1;
        include /home/drd/nginx/conf.d/ai-image-gen/websocket.conf;
    }

    location ~ ^/private/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /home/drd/nginx/logs/ai-image-gen-access.log;
    error_log  /home/drd/nginx/logs/ai-image-gen-error.log;
}
